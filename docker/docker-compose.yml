version: '3'
services:
  autonomous_ws:
    build: .
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: /dev
        target: /dev  
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TZ=Turkey
    container_name: autonomous_ws
    command: /bin/bash
    tty: true
    stdin_open: true
